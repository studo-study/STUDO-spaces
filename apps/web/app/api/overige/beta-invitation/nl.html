<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="color-scheme" content="dark">
  <title>Welkom bij STUDO</title>
</head>
<body style="margin:0;padding:0;background-color:#1d2530;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;">

<table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#1d2530;padding:64px 16px;">
  <tr>
    <td align="center">
      <table width="480" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;width:100%;">

        <!-- Logo -->
        <tr>
          <td align="center" style="padding-bottom:40px;">
            <img src="https://studo.study/logo/hat.svg" alt="STUDO" style="height:56px;display:block;">
          </td>
        </tr>

        <!-- Heading -->
        <tr>
          <td style="text-align:center;padding-bottom:20px;">
            <h1 style="margin:0;color:#ffffff;font-size:26px;line-height:1.3;font-weight:600;letter-spacing:-0.3px;">
              Je bent uitgenodigd!
            </h1>
          </td>
        </tr>

        <!-- Body text -->
        <tr>
          <td style="text-align:center;padding-bottom:36px;">
            <p style="margin:0;color:rgba(255,255,255,0.6);font-size:15px;line-height:1.6;">
              Je hebt toegang tot de publieke beta van Studo.
            </p>
          </td>
        </tr>

        <!-- CTA -->
        <tr>
          <td align="center" style="padding-bottom:56px;">
            <a href="https://beta.studo.study" style="
                display:inline-block;
                background:#3e77ff;
                color:#ffffff;
                text-decoration:none;
                font-size:14px;
                font-weight:600;
                padding:14px 32px;
                border-radius:100px;
              ">Start met leren</a>
          </td>
        </tr>

        <!-- Divider -->
        <tr>
          <td style="border-top:1px solid rgba(255,255,255,0.08);padding-top:32px;"></td>
        </tr>

        <!-- Footer -->
        <tr>
          <td style="text-align:center;">
            <p style="margin:0 0 8px;color:rgba(255,255,255,0.35);font-size:12px;line-height:1.6;">
              <a href="https://instagram.com/studo.study" style="color:rgba(255,255,255,0.5);text-decoration:none;">Instagram</a>
              &nbsp;·&nbsp;
              <a href="https://studo.study" style="color:rgba(255,255,255,0.5);text-decoration:none;">studo.study</a>
            </p>
            <p style="margin:16px 0 0;color:rgba(255,255,255,0.25);font-size:11px;line-height:1.6;">
              © 2026 STUDO &nbsp;·&nbsp;
              <a href="https://studo.study/unsubscribe" style="color:rgba(255,255,255,0.3);text-decoration:underline;">Uitschrijven</a>
            </p>
          </td>
        </tr>

      </table>
    </td>
  </tr>
</table>

</body>
</html>
