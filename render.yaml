services:
  - type: web
    name: studo-api
    runtime: docker
    dockerfilePath: apps/api-node/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: studo-db
          property: connectionString
      - key: AUTH_HASH_LENGTH
        sync: false
      - key: AUTH_HASH_MEMORY_COST
        sync: false
      - key: AUTH_HASH_TIME_COST
        sync: false
      - key: AUTH_JWT_AUDIENCE
        sync: false
      - key: AUTH_JWT_EXPIRATION_INTERVAL
        sync: false
      - key: AUTH_JWT_ISSUER
        sync: false
      - key: AUTH_JWT_SECRET
        sync: false
      - key: AUTH_MAX_DELAY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_TENANT_ID
        sync: false
      - key: MICROSOFT_CALLBACK_URL
        sync: false
      - key: FACEBOOK_CLIENT_ID
        sync: false
      - key: FACEBOOK_CLIENT_SECRET
        sync: false
      - key: FACEBOOK_CALLBACK_URL
        sync: false
      - key: SCALEWAY_ACCESS_KEY
        sync: false
      - key: SCALEWAY_BUCKET_NAME
        sync: false
      - key: SCALEWAY_REGION
        sync: false
      - key: SCALEWAY_SECRET_KEY
        sync: false
      - key: SCW_DEFAULT_ORGANIZATION_ID
        sync: false
      - key: SCW_DEFAULT_PROJECT_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: studo-db
    plan: free
    databaseName: studo
    user: studo
