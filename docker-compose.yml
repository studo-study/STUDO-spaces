services:
  db:
    container_name: db
    image: postgres:16
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - backups:/root/backups
    environment:
      POSTGRES_DB: studo
      POSTGRES_USER: devusr
      POSTGRES_PASSWORD: devpwd
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devusr -d studo"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  cache:
    container_name: redis
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      redis-server
      --save 20 1
      --loglevel warning
      --requirepass eYVX7EwVmmxKPCDmwMtyKVge8oLd2t81
    volumes:
      - cache_data:/data

volumes:
  db_data: {}
  backups: {}
  cache_data: {}
