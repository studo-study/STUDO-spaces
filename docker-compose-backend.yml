services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: studo
    ports:
      - "5432:5432"

  backend:
    build: apps/backend
    ports:
      - "3000:3000"
    env_file:
      - apps/backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/studo
      NODE_ENV: production
      CORS_ORIGINS: '["http://localhost", "http://localhost:80"]'
    depends_on:
      - postgres

  seed:
    build: apps/backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/studo
    command: pnpm db:seed
    depends_on:
      - backend
    profiles:
      - seed