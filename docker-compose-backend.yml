services:
  postgres:
    # plain postgres has no pgvector; migration 0020 needs vector(1536)
    build:
      context: infra/postgres
      dockerfile: Dockerfile
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: studo
    ports:
      - "5432:5432"

  backend:
    build:
      context: .
      dockerfile: infra/api-node/Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/studo
      NODE_ENV: production
      CORS_ORIGINS: '["http://localhost", "http://localhost:80"]'
    depends_on:
      - postgres

  seed:
    build:
      context: .
      dockerfile: infra/api-node/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/studo
    command: pnpm db:seed
    depends_on:
      - backend
    profiles:
      - seed
