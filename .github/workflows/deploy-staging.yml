name: Deploy Staging

on:
  push:
    branches:
      - develop

jobs:
  test-ts:
    name: CI TypeScript
    uses: ./.github/workflows/test-ts.yml
    secrets: inherit

  test-rs:
    name: CI Rust
    uses: ./.github/workflows/test-rs.yml
    secrets: inherit

  test-drt:
    name: CI Flutter
    uses: ./.github/workflows/test-drt.yml
    secrets: inherit

  deploy-web:
    name: Deploy Web to Vercel (preview)
    runs-on: ubuntu-latest
    needs: [test-rs, test-ts]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: pnpm add -g vercel

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/web

      - name: Build
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/web

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/web

  deploy-api:
    name: Deploy API to Railway (staging)
    runs-on: ubuntu-latest
    needs: [test-rs, test-ts]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: railway up --service ${{ vars.RAILWAY_SERVICE_ID_STAGING }}
        working-directory: apps/api-node
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
