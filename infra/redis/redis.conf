# Persistence — Redis is used as cache AND as a streams queue (studo:documents:parse),
# so avoid evicting data under memory pressure.
save 20 1
appendonly yes
appendfsync everysec
maxmemory-policy noeviction
loglevel warning
# NOTE: password is injected at runtime via --requirepass "$REDIS_PASSWORD"
# (see Dockerfile CMD). Do not hardcode secrets here.
